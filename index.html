<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIBAKAT · Layanan Bimbingan dan Konseling — Fakultas Teknik Unesa</title>
<style>
:root{
  color-scheme:light;
  --g950:#2B4538;--g900:#405F4E;--g800:#4F7A63;--g700:#5B8A70;--g600:#6FA287;--g500:#86B79D;--g200:#D5E6DC;--g100:#E8F2EC;--g50:#F3F8F5;
  --gold:#B89A68;--gold-bg:#FBF4E2;
  --ink:#1D2620;--mut:#5C685F;--line:#D9DFD8;--line2:#C6CEC5;--bg:#F5F6F2;--card:#fff;
  --red:#B5655D;--red-bg:#FBECEA;--amber:#8A6100;--amber-bg:#FFF6DC;--blue:#1F4E79;
  --serif:Georgia,"Times New Roman",serif;--sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;color:var(--g900);margin:0 0 .45em;line-height:1.25}
h1{font-size:1.55rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:.3em 0 .8em}
a{color:var(--g700)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}.muted{color:var(--mut)}.small{font-size:.84rem}.b{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 auto}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.mt{margin-top:16px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--g800);background:var(--g800);color:#fff;padding:8px 16px;border-radius:4px;font-weight:600;font-size:.92rem}
.btn:hover{background:var(--g900)}
.btn.sec{background:#fff;color:var(--g800)}.btn.sec:hover{background:var(--g50)}
.btn.link{background:none;border:0;color:var(--g700);padding:2px 4px;text-decoration:underline;font-weight:500}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g200);border-color:var(--g600)}
textarea{min-height:92px;resize:vertical}
.field{margin-bottom:12px}
input[type=checkbox],input[type=radio]{width:auto}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card>h2:first-child,.card>h3:first-child{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.stat{border:1px solid var(--line);background:#fff;border-radius:6px;padding:14px 16px}
.stat .l{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.stat .v{font-family:var(--serif);font-size:1.9rem;color:var(--g900);line-height:1.15}
.note{border:1px solid var(--line2);border-left:4px solid var(--g600);background:var(--g50);padding:10px 14px;margin:12px 0;border-radius:3px}
.note.warn{border-left-color:var(--gold);background:var(--gold-bg)}
.note.crit{border-left-color:var(--red);background:var(--red-bg)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600}
.lvl i{width:10px;height:10px;border-radius:2px;display:inline-block}
.stt{font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:3px;border:1px solid}
.s-pending{color:var(--amber);background:var(--amber-bg);border-color:#E6C96B}
.s-confirmed,.s-done2,.s-active{color:var(--g800);background:var(--g100);border-color:var(--g200)}
.s-done{color:#37474F;background:#ECEFF1;border-color:#B0BEC5}
.s-rejected,.s-cancelled,.s-off{color:var(--red);background:var(--red-bg);border-color:#E6B0AB}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--g50);border-bottom:1px solid var(--line2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}.tw table{min-width:540px}
.tw tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:.9rem}.kv dt{color:var(--mut)}.kv dd{margin:0}
/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4.2fr)}
.aleft{background:var(--g900);color:#EEF5F0;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between}
.aleft h1{color:#fff;font-size:1.9rem;margin-bottom:.6em}
.aleft .inst{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:#BCD6C6}
.aleft ol{padding-left:20px;margin:16px 0 0;color:#DDEBE2}.aleft li{margin:7px 0}
.aleft .zi{border-top:1px solid #6C9680;padding-top:14px;font-size:.84rem;color:#C6DACD}
.aright{display:flex;align-items:center;justify-content:center;padding:28px;background:#fff}
.aright .box{width:100%;max-width:400px}
.langs{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.langs button{border:0;background:#fff;padding:4px 10px;font-size:.78rem;font-weight:700;color:var(--mut)}
.langs button.on{background:var(--g800);color:#fff}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:8px 14px;font-weight:600;color:var(--mut);margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--g800);border-bottom-color:var(--g800)}
.demo{border:1px dashed var(--line2);border-radius:4px;padding:10px 12px;margin-top:16px;background:var(--g50)}
/* shell */
.top{background:var(--g900);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;height:56px;position:sticky;top:0;z-index:20}
.top .wm{display:flex;align-items:center;gap:11px;margin-right:auto}
.top .wm b{font-family:var(--serif);font-size:1.05rem;letter-spacing:.01em}
.top .wm span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:#BCD6C6;line-height:1.1}
.top .langs{border-color:#6F9A83}.top .langs button{background:transparent;color:#CBE0D3}.top .langs button.on{background:#fff;color:var(--g900)}
.top .ub{background:none;border:1px solid #6F9A83;color:#fff;border-radius:4px;padding:5px 12px;font-size:.85rem;position:relative}
.top .ub:hover{background:var(--g800)}
.cnt{display:inline-block;background:var(--gold);color:#201600;font-size:.7rem;font-weight:800;border-radius:9px;padding:0 6px;margin-left:5px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 0}
.side h4{font-family:var(--sans);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 20px 6px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 20px;color:var(--ink);font-size:.93rem}
.side button:hover{background:var(--g50)}
.side button.on{border-left-color:var(--g700);background:var(--g100);color:var(--g900);font-weight:700}
.main{padding:24px 30px 64px;max-width:1160px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.ph p{margin:0;color:var(--mut)}
.panel{position:absolute;right:0;top:40px;width:350px;max-height:430px;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left;z-index:40}
.panel .it{padding:9px 14px;border-bottom:1px solid var(--line);font-size:.86rem;cursor:pointer}.panel .it.un{background:var(--gold-bg)}
.mnav{display:none}
/* forms specific */
.q{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:#fff}
.q .t{font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts.five{grid-template-columns:repeat(5,1fr)}
.opts label{display:flex;gap:7px;align-items:center;margin:0;padding:7px 10px;border:1px solid var(--line2);border-radius:4px;color:var(--ink);font-weight:500;font-size:.84rem;cursor:pointer}
.opts label:has(input:checked){background:var(--g100);border-color:var(--g700);font-weight:700;color:var(--g900)}
.meter{height:8px;background:var(--g100);border-radius:2px;overflow:hidden}.meter>i{display:block;height:100%}
.chat{display:flex;flex-direction:column;height:min(600px,70vh)}
.msgs{flex:1;overflow:auto;padding:14px;background:var(--g50);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:9px}
.m{max-width:80%;padding:8px 12px;border-radius:4px;white-space:pre-wrap;font-size:.92rem}
.m.bot{background:#fff;border:1px solid var(--line2);align-self:flex-start}
.m.me{background:var(--g800);color:#fff;align-self:flex-end}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--g600);background:#fff;color:var(--g800);padding:4px 11px;border-radius:3px;font-size:.83rem;font-weight:600}
.chip:hover{background:var(--g100)}
.modal{position:fixed;inset:0;background:rgba(15,40,28,.55);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:#fff;border-radius:6px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border-top:4px solid var(--g800)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g950);color:#fff;padding:9px 18px;border-radius:4px;z-index:90;font-size:.9rem}
.breath{width:140px;height:140px;border-radius:50%;border:3px solid var(--g600);margin:16px auto;display:grid;place-items:center;color:var(--g800);font-weight:700;transition:transform 4s ease-in-out;background:var(--g50)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:8px 4px;font-size:.8rem;font-weight:600}
.scale button b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--g800)}
.scale button.on,.scale button:hover{background:var(--g100);border-color:var(--g700)}
.prog{display:grid;grid-template-columns:minmax(150px,1.2fr) 1fr 60px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border:0}
.mark{font-weight:800;font-size:.8rem}.ok{color:var(--g700)}.no{color:var(--red)}
svg text{font-family:var(--sans)}
@media(max-width:920px){
  .auth{grid-template-columns:1fr}.aleft{padding:26px}
  .shell{grid-template-columns:1fr}.side{display:none}.split{grid-template-columns:1fr}
  .main{padding:16px 14px 88px}.top{padding:0 12px}.top .wm span{display:none}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line2);z-index:40;overflow-x:auto}
  .mnav button{flex:1 0 76px;border:0;background:none;padding:10px 6px;font-size:.74rem;color:var(--mut)}
  .mnav button.on{color:var(--g800);font-weight:800;box-shadow:inset 0 3px 0 var(--g700)}
  .opts,.opts.five{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr}
}
@media print{.top,.side,.mnav,.noprint{display:none!important}.shell{display:block}.main{padding:0;max-width:none}body{background:#fff}}
/* ===== v5 : tampilan dalam aplikasi ===== */
body{background:radial-gradient(900px 400px at 100% 0,#E3F0E7,transparent 60%),radial-gradient(700px 400px at 0 100%,#F6EFD9,transparent 60%),#F3F6F2;background-attachment:fixed}
.btn{border-radius:99px;padding:9px 20px;background:linear-gradient(135deg,#4F7A63,#628F76);border:0;box-shadow:0 6px 14px -6px rgba(79,122,99,.6);transition:.18s}
.btn:hover{background:linear-gradient(135deg,#405F4E,#4F7A63);transform:translateY(-1px)}
.btn.sec{background:#fff;border:1.5px solid var(--g200);color:var(--g800);box-shadow:none}.btn.sec:hover{background:var(--g50);border-color:var(--g600)}
.btn.danger{background:linear-gradient(135deg,#B5655D,#C97B72)}
.btn.link{background:none;box-shadow:none;border:0;padding:2px 4px}.btn.link:hover{background:none;transform:none}
.btn.sm{padding:5px 13px}
input,select,textarea{border-radius:10px;border:1.5px solid var(--line2);padding:9px 12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g600);box-shadow:0 0 0 4px rgba(111,162,135,.15)}
.card{border-radius:18px;border:1px solid #E1EAE3;box-shadow:0 10px 28px -14px rgba(64,95,78,.28);padding:22px 24px;background:#fff}
.card>h2:first-child,.card>h3:first-child{border-bottom:0;padding-bottom:0;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card>h2:first-child:before{content:"";width:6px;height:22px;border-radius:9px;background:linear-gradient(180deg,#DCC28F,#B89A68)}
.stat{position:relative;overflow:hidden;border:0;border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#4F7A63,#7DB08F);box-shadow:0 14px 26px -14px rgba(79,122,99,.7)}
.stat:after{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.14)}
.grid>.stat:nth-child(4n+2){background:linear-gradient(135deg,#A88B58,#D3B67C);box-shadow:0 14px 26px -14px rgba(154,114,32,.7)}
.grid>.stat:nth-child(4n+3){background:linear-gradient(135deg,#6B9DB0,#9CC5D3);box-shadow:0 14px 26px -14px rgba(31,111,139,.7)}
.grid>.stat:nth-child(4n+4){background:linear-gradient(135deg,#8C6580,#C79DB9);box-shadow:0 14px 26px -14px rgba(122,47,94,.7)}
.stat .l{color:rgba(255,255,255,.85);position:relative}.stat .v{color:#fff!important;font-size:2.2rem;position:relative}.stat .small{color:rgba(255,255,255,.85)!important}
.note{border-radius:14px;border:1px solid var(--g200);border-left:5px solid var(--g600);background:linear-gradient(90deg,#F2F8F4,#fff)}
.note.warn{border-color:#EBD79B;border-left-color:var(--gold);background:linear-gradient(90deg,#FFF7E0,#fff)}
.note.crit{border-color:#EBC0BA;border-left-color:var(--red);background:linear-gradient(90deg,#FDEDEB,#fff)}
.stt{border-radius:99px;padding:2px 11px}
.lvl i{border-radius:50%}
.tw{border-radius:16px;border:1px solid #E1EAE3;box-shadow:0 8px 22px -16px rgba(64,95,78,.4)}
th{background:linear-gradient(180deg,#F2F8F4,#E8F2EC);color:var(--g800);padding:11px 12px}
td{padding:11px 12px}
tbody tr:nth-child(even){background:#FAFCFA}tbody tr:hover{background:#F0F7F2}
.meter{height:10px;border-radius:99px;background:#E4EEE7}.meter>i{border-radius:99px}
.tabs{border-bottom:0;background:#EEF4F0;border-radius:99px;padding:4px;display:inline-flex}
.tabs button{border-radius:99px;margin:0;border:0;padding:7px 18px}.tabs button.on{background:#fff;color:var(--g800);box-shadow:0 3px 10px rgba(64,95,78,.15);border:0}
.langs{border-radius:99px}.langs button{padding:4px 12px}
/* topbar */
.top{height:64px;background:linear-gradient(90deg,#33503F,#405F4E 60%,#5E8F77);box-shadow:0 6px 20px -8px rgba(0,0,0,.45)}
.top .wm b{font-size:1.1rem}
.top .ub{border-radius:99px;border-color:rgba(255,255,255,.3);padding:6px 16px}.top .ub:hover{background:rgba(255,255,255,.14)}
.shell{grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{background:transparent;border:0;padding:20px 14px}
.side>*{position:relative}
.side h4{margin:18px 12px 8px;color:#6B7D71}
.side button{display:flex;align-items:center;gap:11px;border:0;border-radius:14px;padding:10px 14px;margin-bottom:3px;color:#2A3A30;font-weight:500;transition:.15s}
.side button svg{width:19px;height:19px;flex:none;color:#5F8A70}
.side button:hover{background:#fff;box-shadow:0 4px 12px -6px rgba(64,95,78,.3)}
.side button.on{background:linear-gradient(135deg,#4F7A63,#628F76);color:#fff;box-shadow:0 10px 18px -10px rgba(79,122,99,.9)}
.side button.on svg{color:#F1E4C8}
.main{padding:26px 34px 70px}
/* page banner */
.ph{position:relative;overflow:hidden;border:0;border-radius:22px;padding:26px 30px;margin-bottom:22px;color:#fff;background:radial-gradient(500px 220px at 100% 0,rgba(220,194,143,.35),transparent 60%),linear-gradient(135deg,#405F4E,#5B8A70);box-shadow:0 18px 34px -18px rgba(64,95,78,.8)}
.ph:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000)}
.ph>*{position:relative}.ph h1{color:#fff;font-size:1.7rem;margin-bottom:4px}.ph p{color:#D5E6DC}
.ph .btn.sec{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}.ph .btn.sec:hover{background:rgba(255,255,255,.25)}
.panel{border-radius:16px;box-shadow:0 20px 44px rgba(0,0,0,.25)}
/* forms */
.q{border-radius:16px;border:1px solid #E1EAE3;box-shadow:0 6px 16px -12px rgba(64,95,78,.4);padding:16px 18px}
.opts label{border-radius:12px;border-width:1.5px;padding:9px 12px;transition:.15s}.opts label:hover{border-color:var(--g600);background:var(--g50)}
.opts label:has(input:checked){background:linear-gradient(135deg,#4F7A63,#628F76);color:#fff;border-color:transparent}
.chat{height:min(620px,72vh)}
.msgs{border-radius:18px;background:linear-gradient(180deg,#EEF5F0,#F8FBF9);padding:18px}
.m{border-radius:18px;padding:10px 15px;line-height:1.5}
.m.bot{border-radius:18px 18px 18px 4px;border:0;box-shadow:0 4px 12px -8px rgba(64,95,78,.5)}
.m.me{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#4F7A63,#628F76)}
.chip{border-radius:99px;border-width:1.5px;padding:6px 14px}.chip:hover{background:var(--g800);color:#fff}
.scale button{border-radius:14px;border-width:1.5px;padding:10px 4px}
.scale button.on,.scale button:hover{background:linear-gradient(135deg,#E8F2EC,#fff);border-color:var(--g600);box-shadow:0 6px 14px -8px rgba(79,122,99,.7)}
.breath{background:radial-gradient(circle,#fff,#E4F1E8);box-shadow:0 0 0 12px rgba(111,162,135,.08),0 0 0 26px rgba(111,162,135,.05)}
.modal{backdrop-filter:blur(4px)}
.mbox{border-radius:22px;border-top:0;box-shadow:0 30px 70px rgba(0,0,0,.35);background:linear-gradient(180deg,#F2F8F4 0,#fff 90px)}
.toast{border-radius:99px;padding:11px 24px;box-shadow:0 14px 30px rgba(0,0,0,.3);background:linear-gradient(135deg,#33503F,#4F7A63)}
.kv dt{font-weight:600;color:var(--g800)}
/* login */
.aleft{background:radial-gradient(600px 400px at 90% 0,rgba(143,191,162,.4),transparent 60%),radial-gradient(500px 400px at 0 100%,rgba(220,194,143,.22),transparent 60%),linear-gradient(135deg,#33503F,#405F4E 60%,#5E8F77);position:relative;overflow:hidden}
.aleft:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1.2px,transparent 1.2px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000,transparent)}
.aleft>*{position:relative}.aleft .zi{border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.07)}
.aleft h1{font-size:2.2rem;line-height:1.12}.aleft li::marker{color:#DCC28F}
.aright{background:linear-gradient(180deg,#fff,#F2F8F4)}
.aright .box{background:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 60px -24px rgba(64,95,78,.45);border:1px solid #E1EAE3}
.demo{border-radius:14px;background:#F2F8F4}

function seedRules(){const R=(ci,ce,kw,ri,re)=>({id:uid(),cat:{id:ci,en:ce},keywords:kw,reply:{id:ri,en:re},active:true});return [
 R('Stres akademik','Academic stress',['stres','tugas','skripsi','deadline','ujian','kuliah','praktikum','ipk','stress','assignment','thesis','exam','coursework','study'],'Stres akademik sangat umum dialami mahasiswa. Beberapa hal yang dapat membantu: pecah tugas menjadi bagian kecil, buat jadwal belajar, istirahat teratur, dan bicarakan dengan teman atau dosen wali. Anda juga dapat mencoba skrining PHQ-9 atau membuat janji konseling.','Academic stress is very common among students. Things that may help: break tasks into small parts, set a study schedule, rest regularly, and talk to a friend or your academic advisor. You can also try the PHQ-9 screening or book a counseling session.'),
 R('Tidur','Sleep',['susah tidur','sulit tidur','insomnia','begadang','tidak bisa tidur','tidur','sleep','insomnia','can\'t sleep','cannot sleep'],'Gangguan tidur dapat memengaruhi konsentrasi dan suasana hati. Coba jam tidur teratur, kurangi layar 1 jam sebelum tidur, dan batasi kafein sore hari. Jika berlangsung lebih dari 2 minggu, pertimbangkan berbicara dengan konselor.','Poor sleep can affect concentration and mood. Try a regular bedtime, cut screens one hour before sleep, and limit afternoon caffeine. If it lasts more than two weeks, consider talking to a counselor.'),
 R('Kecemasan','Anxiety',['cemas','takut','gugup','panik','khawatir','overthinking','was-was','anxious','anxiety','worried','nervous','panic','afraid'],'Rasa cemas wajar muncul saat menghadapi tekanan. Cobalah latihan napas 4-4-6 (menu Swabantu), kenali pemicunya, dan fokus pada hal yang dapat Anda kendalikan. Konselor siap membantu bila kecemasan mengganggu aktivitas.','Feeling anxious under pressure is normal. Try the 4-4-6 breathing exercise (Self-care menu), identify your triggers, and focus on what you can control. A counselor can help if anxiety gets in the way of daily activities.'),
 R('Suasana hati sedih','Low mood',['sedih','murung','putus asa','kesepian','menangis','hampa','sendirian','sad','lonely','hopeless','crying','empty','down'],'Terima kasih sudah berbagi. Perasaan sedih perlu didengar. Bercerita pada orang tepercaya dapat membantu, dan Anda dapat mengisi skrining PHQ-9 atau menjadwalkan sesi dengan konselor kapan saja.','Thank you for sharing. Sadness deserves to be heard. Talking to someone you trust can help, and you can take the PHQ-9 screening or book a session with a counselor at any time.'),
 R('Motivasi','Motivation',['malas','males','tidak semangat','bosan','lelah','capek','burnout','unmotivated','tired','bored','exhausted'],'Kehilangan semangat bisa menjadi tanda tubuh dan pikiran perlu istirahat. Tetapkan target kecil harian, beri penghargaan pada diri sendiri, dan pastikan tidur serta makan cukup. Konselor dapat membantu menyusun strategi belajar.','Losing motivation can be a sign that your body and mind need rest. Set small daily goals, reward yourself, and make sure you sleep and eat enough. A counselor can help you plan a study strategy.'),
 R('Hubungan sosial','Relationships',['teman','pacar','keluarga','konflik','bertengkar','orang tua','roommate','kos','friend','family','conflict','argument','parents','partner'],'Hubungan dengan orang sekitar memang dapat memengaruhi kesejahteraan. Komunikasikan perasaan dengan tenang dan jujur. Jika konflik terasa berat, konselor dapat menjadi ruang aman untuk membahasnya.','Relationships with people around us can affect our wellbeing. Try to express your feelings calmly and honestly. If a conflict feels heavy, a counselor can offer a safe space to talk it through.'),
 R('Layanan konseling','Counseling service',['konsultasi','konselor','janji','curhat','bimbingan','konseling','counselor','counseling','appointment','book','consult'],'Anda dapat membuat janji dengan konselor melalui menu Janji Konseling. Pilih konselor, tanggal, sesi, dan modalitas (tatap muka atau daring). Layanan Senin–Jumat dan tanpa biaya.','You can book a counselor from the Appointments menu. Choose a counselor, date, session, and mode (in person or online). The service runs Monday to Friday and is free of charge.'),
 R('Skrining','Screening',['phq','depresi','tes','skrining','screening','kuesioner','depression','questionnaire','test'],'PHQ-9 adalah kuesioner 9 butir untuk membantu mengenali gejala depresi dalam 2 minggu terakhir. Hasilnya bukan diagnosis. Anda dapat mengisinya di menu Skrining PHQ-9.','The PHQ-9 is a 9-item questionnaire that helps recognize depressive symptoms over the last two weeks. The result is not a diagnosis. You can take it in the PHQ-9 Screening menu.'),
 R('Sapaan','Greeting',['halo','hai','hi','hello','hey','selamat pagi','selamat siang','selamat sore','selamat malam','assalamualaikum','good morning','good afternoon'],'Halo! Saya GC Chatbot. Saya dapat memberi informasi awal dan mengarahkan ke layanan konseling. Ceritakan apa yang sedang Anda rasakan, atau pilih topik di bawah.','Hello! I am the GC Chatbot. I can give first-line information and point you to counseling services. Tell me what you are feeling, or pick a topic below.')]}

  db={users,assessments:[],appts:[],notes:[],chatLogs:[],rules:seedRules(),notifs:[],moods:[],consent:{},complaints:[],skm:[],sus:[],audit:[],followups:[],pubs:seedPubs()};

  const mkAns=a=>{const o=Array(9).fill(0);let r=a,i=0;while(r>0&&i<400){const j=i%9;if(o[j]<3){o[j]++;r--}i++}if(a>=20){if(o[8]===0){o[8]=1;let k=0;while(o.reduce((x,y)=>x+y,0)>a){const j=k%8;if(o[j]>0)o[j]--;k++}}}return o};

  const d=n=>iso(Date.now()+n*DAY),A=(o)=>db.appts.push({id:uid(),note:'',...o});
  A({uid:stu[1].id,cid:cons[0].id,date:d(2),slot:SLOTS[1],mode:'f2f',note:'Cemas menjelang ujian',status:'pending',created:Date.now()-DAY/3});

  A({uid:stu[4].id,cid:cons[0].id,date:d(3),slot:SLOTS[3],mode:'f2f',status:'confirmed',created:Date.now()-2*DAY,confirmTs:Date.now()-2*DAY+4*HOUR});
  for(let i=0;i<6;i++)A({uid:stu[(i%8)+1].id,cid:cons[i%2].id,date:d(-6-i*3),slot:SLOTS[i%5],mode:i%2?'online':'f2f',status:'done',created:Date.now()-(8+i*3)*DAY,confirmTs:Date.now()-(8+i*3)*DAY+(i===4?30:5+i)*HOUR});
  A({uid:stu[0].id,cid:cons[0].id,date:d(-10),slot:SLOTS[2],mode:'f2f',note:'Konsultasi studi',status:'done',created:Date.now()-14*DAY,confirmTs:Date.now()-14*DAY+6*HOUR});
  [['Aku stres tugas kuliah menumpuk','Stres akademik'],['Susah tidur akhir-akhir ini','Tidur'],['halo','Sapaan'],['Mau konsultasi dengan konselor','Layanan konseling'],['kucingku lucu hari ini',null]].forEach(([t,c],i)=>{const r=c?db.rules.find(x=>x.cat.id===c):null;db.chatLogs.push({id:uid(),uid:stu[(i+1)%stu.length].id,ts:Date.now()-(i*2+1)*DAY/3,text:t,reply:r?r.reply.id:'',cat:r?r.cat:{id:'Tidak dikenali',en:'Unrecognized'},matched:!!r})});

const isWeekend=s=>[0,6].includes(new Date(s+'T00:00:00').getDay());
const slotTaken=(cid,date,slot,ex)=>db.appts.some(a=>a.cid===cid&&a.date===date&&a.slot===slot&&['pending','confirmed'].includes(a.status)&&a.id!==ex);
function alternatives(cid,date,n=4){const out=[];const t0=new Date(date+'T00:00:00').getTime();for(let i=0;i<12&&out.length<n;i++){const ds=iso(t0+i*DAY);if(isWeekend(ds)||ds<iso(Date.now()+DAY))continue;for(const s of SLOTS){if(!slotTaken(cid,ds,s)&&!(ds===date&&i===0)){out.push({date:ds,slot:s});if(out.length>=n)break}}}return out}
function botReply(text){
  const norm=' '+text.toLowerCase().replace(/[^\p{L}\p{N}\s'-]/gu,' ').replace(/\s+/g,' ')+' ';
  if(CRISIS.some(k=>norm.includes(k)))return {crisis:true,cat:{id:'Darurat',en:'Emergency'},reply:CRISIS_REPLY,matched:true};
  let best=null,bs=0;
  for(const r of db.rules.filter(r=>r.active)){let sc=0;for(const k of r.keywords){const kk=k.toLowerCase().trim();if(!kk)continue;if(kk.length<=3?norm.includes(' '+kk+' '):norm.includes(kk))sc+=kk.split(' ').length}if(sc>bs){bs=sc;best=r}}
  if(best)return {cat:best.cat,reply:best.reply,matched:true};
  return {cat:{id:'Tidak dikenali',en:'Unrecognized'},reply:{id:'Maaf, saya belum dapat memahami pesan tersebut. Jika Anda ingin berbicara langsung dengan konselor, Anda dapat mengajukan janji melalui menu Janji Konseling.',en:'Sorry, I could not understand that message. If you would like to speak to a counselor directly, you can book an appointment from the Appointments menu.'},matched:false,escalate:true};
}
/* ---------- indikator pelayanan publik / Zona Integritas ---------- */
function ikm(list){if(!list.length)return null;const per=SKM_ITEMS.map((_,j)=>list.reduce((s,x)=>s+x.scores[j],0)/list.length);return {per,val:per.reduce((a,b)=>a+b,0)/9*25}}
function ziIndicators(){
  const conf=db.appts.filter(a=>a.confirmTs&&a.created);const apptOk=conf.filter(a=>a.confirmTs-a.created<=SLA.apptH*HOUR).length;
  const alerts=db.assessments.filter(a=>a.score>=10&&a.ts<Date.now()-SLA.alertH*HOUR);const alOk=alerts.filter(a=>{const f=db.followups.find(x=>x.aid===a.id);return f&&f.ts-a.ts<=SLA.alertH*HOUR}).length;
  const cp=db.complaints;const cpOk=cp.filter(c=>c.resp.length&&c.resp[0].ts-c.ts<=SLA.complaintH*HOUR).length;
  const k=ikm(db.skm),su=db.sus.length?db.sus.reduce((s,x)=>s+x.score,0)/db.sus.length:null;
  const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
  return [
   {key:'ikm',id:'Indeks Kepuasan Masyarakat (IKM)',en:'Public Satisfaction Index (IKM)',val:k?Math.round(k.val*100)/100:null,unit:'',target:76.61,tl:'≥ 76,61 (B)',n:db.skm.length},
   {key:'appt',id:'Janji dikonfirmasi ≤ 1×24 jam',en:'Appointments confirmed within 24 h',val:pct(apptOk,conf.length),unit:'%',target:90,tl:'≥ 90%',n:conf.length},
   {key:'alert',id:'Alert risiko ditindaklanjuti ≤ 1×24 jam',en:'Risk alerts followed up within 24 h',val:pct(alOk,alerts.length),unit:'%',target:90,tl:'≥ 90%',n:alerts.length},
   {key:'cmp',id:'Pengaduan ditanggapi ≤ 3 hari',en:'Complaints answered within 3 days',val:pct(cpOk,cp.length),unit:'%',target:90,tl:'≥ 90%',n:cp.length},
   {key:'sus',id:'Skor kegunaan sistem (SUS)',en:'System usability score (SUS)',val:su===null?null:Math.round(su*10)/10,unit:'',target:68,tl:'≥ 68',n:db.sus.length}];
}

function trendSVG(list,w=540,h=190){
  const pts=[...list].sort((a,b)=>a.ts-b.ts);if(!pts.length)return `<p class="muted">${T('Belum ada data skrining.','No screening data yet.')}</p>`;
  const pad={l:30,r:12,t:10,b:26},W=w-pad.l-pad.r,H=h-pad.t-pad.b,x=i=>pad.l+(pts.length===1?W/2:i*W/(pts.length-1)),y=s=>pad.t+H-(s/27)*H;
  let bands='';TIERS.forEach(t=>{const hi=Math.min(27,t.max+1);bands+=`<rect x="${pad.l}" y="${y(hi)}" width="${W}" height="${y(t.min)-y(hi)}" fill="${t.col}" opacity=".09"/>`});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="PHQ-9">${bands}${[0,5,10,15,20,27].map(v=>`<text x="2" y="${y(v)+3}" font-size="10" fill="#5C685F">${v}</text><line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#D9DFD8" stroke-dasharray="2 3"/>`).join('')}
  <path d="${pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.score)}`).join(' ')}" fill="none" stroke="#4F7A63" stroke-width="2"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.score)}" r="4.5" fill="${TIERS[p.tier].col}" stroke="#fff" stroke-width="1.5"><title>${fmtD(p.ts)}: ${p.score}</title></circle><text x="${x(i)}" y="${h-9}" font-size="9" text-anchor="middle" fill="#5C685F">${new Date(p.ts).toLocaleDateString(LOC(),{day:'2-digit',month:'short'})}</text>`).join('')}</svg>`;
}

function render(){
  document.documentElement.lang=lang;const app=$('#app');
  if(!S.user){app.innerHTML=S.auth?viewAuth():viewLanding();paintModal();if(!S.auth)window.scrollTo&&0;return}
  if(S.user.role==='konselor'&&!S.user.pakta){app.innerHTML=vPakta();paintModal();return}
  const vs=VIEWS[S.user.role];if(!vs[S.view])S.view=Object.keys(vs)[0];
  app.innerHTML=vs[S.view]();paintModal();
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
  const rs=$('#restore');if(rs)rs.onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.users)throw 0;db=d;save();toast(T('Data dipulihkan','Data restored'));render()}catch(x){toast(T('Berkas tidak valid','Invalid file'))}})};
}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const csv=rows=>'﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
async function doLogin(email,pw){
  const u=db.users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase());
  if(!u||u.pw!==await hash(pw)){toast(T('Surel atau kata sandi salah','Incorrect email or password'));return}
  if(!u.active){toast(T('Akun dinonaktifkan. Hubungi admin.','Account deactivated. Contact the admin.'));return}
  S.user=u;S.view='';S.lastResult=null;store.set(SKEY,u.id);logA('login',rn(u.role));save();render();
}
function sendChat(text){
  text=text.trim();if(!text)return;const r=botReply(text);
  db.chatLogs.push({id:uid(),uid:S.user.id,ts:Date.now(),text,reply:r.reply,cat:r.cat,matched:r.matched});
  if(r.crisis){notifyRole('konselor',{id:`INDIKASI RISIKO pada chatbot: ${S.user.name}`,en:`RISK INDICATION in chatbot: ${S.user.name}`},'crit','logchat');notifyRole('admin',{id:`Indikasi risiko pada chatbot (${pseud(S.user.id)})`,en:`Risk indication in chatbot (${pseud(S.user.id)})`},'crit','dasbor')}
  save();const box=$('#msgs');box.insertAdjacentHTML('beforeend',`<div class="m me">${esc(text)}</div>`);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{box.insertAdjacentHTML('beforeend',`<div class="m bot">${esc(LB(r.reply))}</div>${r.escalate?`<div class="chips"><button class="chip" data-go="janji">${T('Buat janji konseling','Book a counseling session')}</button></div>`:''}`);box.scrollTop=box.scrollHeight},320);
}
let breathing=false;
async function breathe(){if(breathing)return;breathing=true;const el=$('#breath'),w=ms=>new Promise(r=>setTimeout(r,ms));
  for(let i=1;i<=5;i++){if(!$('#breath'))break;el.style.transition='transform 4s ease-in-out';el.textContent=T('Tarik napas','Breathe in');el.style.transform='scale(1.3)';await w(4000);el.textContent=T('Tahan','Hold');await w(4000);el.style.transition='transform 6s ease-in-out';el.textContent=T('Buang napas','Breathe out');el.style.transform='scale(1)';await w(6000)}
  if($('#breath'))el.textContent=T('Selesai','Done');breathing=false}
const SEL='[data-go],[data-act],[data-tab],[data-ctab],[data-lang],[data-demo],[data-mood],[data-chip],[data-cancel],[data-alt],[data-detail],[data-fup],[data-newnote],[data-editnote],[data-delnote],[data-aconf],[data-aresch],[data-arej],[data-afin],[data-doresch],[data-edituser],[data-toggleuser],[data-editrule],[data-togglerule],[data-delrule],[data-cmp],[data-editpub],[data-delpub]';
document.addEventListener('click',async e=>{
  const t=e.target.closest(SEL);if(!t)return;const d=t.dataset;
  if(t.classList.contains('modal')&&e.target!==t)return;
  if(d.lang){lang=d.lang;store.set(LKEY,lang);return render()}
  if(d.go)return go(d.go);
  if(d.tab){S.tab=d.tab;return render()}
  if(d.ctab){S.ctab=d.ctab;return complaintModal()}
  if(d.demo){const [a,b]=d.demo.split('|');S.modal=null;paintModal();return doLogin(a,b)}
  if(d.mood!==undefined){db.moods=db.moods.filter(m=>!(m.uid===S.user.id&&iso(m.ts)===iso(Date.now())));db.moods.push({id:uid(),uid:S.user.id,ts:Date.now(),mood:+d.mood});save();toast(T('Check-in tersimpan','Check-in saved'));return render()}
  if(d.chip)return sendChat(d.chip);
  if(d.cancel){const a=db.appts.find(x=>x.id===d.cancel);a.status='cancelled';notifyRole('konselor',{id:`${S.user.name} membatalkan janji ${fmtISO(a.date)} ${a.slot}`,en:`${S.user.name} cancelled the appointment on ${fmtISO(a.date)} ${a.slot}`},'info','antrean');logA('appt_cancel',`${a.date} ${a.slot}`);toast(T('Janji dibatalkan','Appointment cancelled'));return saveRender()}
  if(d.alt){const [dt,sl]=d.alt.split('|');S.form={...(S.form||{}),date:dt,slot:sl};S.alt=null;return render()}
  if(d.detail)return detailModal(d.detail);
  if(d.fup){const a=db.assessments.find(x=>x.id===d.fup);db.followups.push({id:uid(),aid:a.id,cid:S.user.id,ts:Date.now()});logA('alert_followup',`${U(a.uid).name} (${a.score})`);toast(T('Ditandai ditindaklanjuti','Marked as followed up'));closeModal();return saveRender()}
  if(d.newnote)return noteModal(d.newnote);
  if(d.editnote){const n=db.notes.find(x=>x.id===d.editnote);return noteModal(n.uid,n.id)}
  if(d.delnote){if(confirm(T('Hapus catatan ini?','Delete this note?'))){db.notes=db.notes.filter(n=>n.id!==d.delnote);logA('note_delete','');saveRender()}return}
  if(d.aconf){const a=db.appts.find(x=>x.id===d.aconf);a.status='confirmed';a.confirmTs=Date.now();notify(a.uid,{id:`Janji Anda ${fmtISO(a.date)} (${a.slot}) telah dikonfirmasi.`,en:`Your appointment on ${fmtISO(a.date)} (${a.slot}) is confirmed.`},'info','janji');logA('appt_confirm',`${U(a.uid).name} ${a.date}`);toast(T('Janji dikonfirmasi','Appointment confirmed'));return saveRender()}
  if(d.arej){const a=db.appts.find(x=>x.id===d.arej);a.status='rejected';notify(a.uid,{id:`Janji Anda ${fmtISO(a.date)} (${a.slot}) belum dapat dipenuhi. Silakan pilih jadwal lain.`,en:`Your appointment on ${fmtISO(a.date)} (${a.slot}) could not be accommodated. Please choose another time.`},'warn','janji');logA('appt_reject',a.date);return saveRender()}
  if(d.afin){const a=db.appts.find(x=>x.id===d.afin);a.status='done';logA('appt_done',a.date);toast(T('Ditandai selesai','Marked completed'));return saveRender()}
  if(d.aresch){const a=db.appts.find(x=>x.id===d.aresch),alts=alternatives(a.cid,a.date,5);
    return modal(`<h2>${T('Jadwal ulang','Reschedule')}</h2><p class="muted small">${T('Pilih jadwal alternatif; mahasiswa akan diberi notifikasi.','Choose an alternative; the student will be notified.')}</p><div class="chips">${alts.map(z=>`<button class="chip" data-doresch="${a.id}|${z.date}|${z.slot}">${fmtISO(z.date)} · ${z.slot}</button>`).join('')||`<span class="muted">${T('Tidak ada slot.','No slots.')}</span>`}</div>${closeBtn()}`)}
  if(d.doresch){const [id,dt,sl]=d.doresch.split('|'),a=db.appts.find(x=>x.id===id);a.date=dt;a.slot=sl;a.status='pending';notify(a.uid,{id:`Janji Anda dijadwalkan ulang ke ${fmtISO(dt)} (${sl}).`,en:`Your appointment was rescheduled to ${fmtISO(dt)} (${sl}).`},'warn','janji');logA('appt_resched',dt);closeModal();toast(T('Jadwal diperbarui','Schedule updated'));return saveRender()}
  if(d.edituser)return userModal(d.edituser);
  if(d.toggleuser){const u=U(d.toggleuser);if(u.id===S.user.id)return toast(T('Tidak dapat menonaktifkan akun sendiri','You cannot deactivate your own account'));u.active=!u.active;logA('user_toggle',u.email);return saveRender()}
  if(d.editrule)return ruleModal(d.editrule);
  if(d.togglerule){const r=db.rules.find(x=>x.id===d.togglerule);r.active=!r.active;logA('rule_toggle',LB(r.cat));return saveRender()}
  if(d.delrule){if(confirm(T('Hapus aturan ini?','Delete this rule?'))){db.rules=db.rules.filter(r=>r.id!==d.delrule);logA('rule_delete','');saveRender()}return}
  if(d.cmp)return cmpModal(d.cmp);
  if(d.editpub)return pubModal(d.editpub);
  if(d.delpub){if(confirm(T('Hapus data ini?','Delete this record?'))){db.pubs=db.pubs.filter(x=>x.id!==d.delpub);logA('pub_delete','');saveRender()}return}
  switch(d.act){
   case 'showauth':S.auth=true;S.tab=d.tab2||'login';return render();
   case 'home':S.auth=false;return render();
   case 'logout':logA('logout','');save();store.del(SKEY);S.user=null;S.auth=false;S.view='';S.lastResult=null;return render();
   case 'bell':S.notif=!S.notif;return render();
   case 'readall':myNotifs().forEach(n=>n.read=true);S.notif=false;return saveRender();
   case 'more':{const flat=NAVS[S.user.role].flatMap(g=>g[2]);return modal(`<h2>${T('Menu','Menu')}</h2><div class="chips">${flat.map(([k,i,en])=>`<button class="chip" data-go="${k}">${T(i,en)}</button>`).join('')}</div>${closeBtn()}`)}
   case 'mclose':return closeModal();
   case 'consent':db.consent[S.user.id]=Date.now();logA('consent','PHQ-9');return saveRender();
   case 'pakta':S.user.pakta=Date.now();logA('pakta','Pakta integritas');return saveRender();
   case 'newscreen':S.lastResult=null;return go('beranda');
   case 'breath':return breathe();
   case 'newnote2':return noteModal($('#nsel').value);
   case 'demo':return modal(`<h2>${T('Coba demo','Try the demo')}</h2><p class="muted small">${T('Pilih peran. Data contoh, tanpa pendaftaran.','Pick a role. Sample data, no sign-up.')}</p>${demoCards()}<div class="mt">${closeBtn()}</div>`);
   case 'newpub':return pubModal();
   case 'csvpub':return download('luaran_sibakat.csv',csv([['Jenis','Judul','Penulis','Wadah','Indeks','Status','Tanggal','Rujukan','Tautan'],...(db.pubs||[]).map(x=>[PUB_TYPE[x.type]?.[0],x.title,x.authors,x.venue,x.index,PUB_STAT[x.status][0],x.date,x.ref,x.url])]),'text/csv');
   case 'newuser':return userModal();
   case 'newrule':return ruleModal();
   case 'pubstat':return modal(`<h2>${T('Statistik Layanan','Service Statistics')}</h2>${statHTML()}${closeBtn()}`);
   case 'pubguide':return modal(`<h2>${T('Panduan Penggunaan','User Guide')}</h2>${guideHTML()}${closeBtn()}`);
   case 'pubmaklumat':return modal(`<h2>${T('Maklumat dan Standar Pelayanan','Service Charter and Standard')}</h2>${maklumatHTML()}${closeBtn()}`);
   case 'pubcomplaint':S.ctab='new';S.trackCode='';return complaintModal();
   case 'trackbtn':S.ctab='track';return complaintModal();
   case 'testbot':{const r=botReply($('#tin').value||'');$('#tout').innerHTML=`<b>${T('Kategori','Category')}:</b> ${esc(LB(r.cat))} · <b>${T('Cocok','Matched')}:</b> ${r.matched?T('ya','yes'):T('tidak','no')}<br>${esc(LB(r.reply))}`;return}
   case 'print':return window.print();
   case 'csv':{const m=S.filter.month||monthKeys()[0],r=reportData(m);logA('export','laporan '+m);save();return download(`laporan_sibakat_${m}.csv`,csv([['Bulan',m],['Skrining',r.as.length],['Mahasiswa unik',r.uniq],['Alert (>=10)',r.alerts],['Janji',r.ap.length],['Chatbot',r.ch.length],['Chatbot tidak dikenali',r.unrec],[],['Tingkat risiko','Jumlah'],...r.dist.map(x=>[TIERS[x.i].id,x.n]),[],['Indikator','Capaian','Target'],...ziIndicators().map(z=>[z.id,z.val,z.tl])]),'text/csv')}
   case 'csvsurvey':{logA('export','survei');save();const k=ikm(db.skm);return download('survei_sibakat.csv',csv([['IKM',k?k.val.toFixed(2):''],...SKM_ITEMS.map((it,i)=>[it[0],k?k.per[i].toFixed(2):'']),[],['SUS rata-rata',db.sus.length?(db.sus.reduce((s,x)=>s+x.score,0)/db.sus.length).toFixed(1):''],['n SUS',db.sus.length]]),'text/csv')}
   case 'csvaudit':return download('audit_sibakat.csv',csv([['Waktu','Pengguna','Aktivitas','Rincian'],...db.audit.map(a=>[new Date(a.ts).toISOString(),a.uid?U(a.uid)?.email:'publik',a.action,a.detail])]),'text/csv');
   case 'backup':logA('export','backup');save();return download('sibakat_cadangan_'+iso(Date.now())+'.json',JSON.stringify(db),'application/json');
   case 'reset':if(confirm(T('Reset seluruh data ke data demo?','Reset all data to the demo set?'))){store.del(KEY);store.del(SKEY);S.user=null;await seed();render();toast(T('Data demo dimuat ulang','Demo data reloaded'))}return;
  }
});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(f){S.filter[f]=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.filter==='q'){S.filter.q=e.target.value;const p=e.target.selectionStart;render();const n=$('[data-filter="q"]');if(n){n.focus();n.setSelectionRange(p,p)}}});
const newCode=()=>'ADU-'+iso(Date.now()).slice(2,7).replace('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
document.addEventListener('submit',async e=>{
  const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const k=form.dataset.form;
  if(k==='login')return doLogin($('#le').value,$('#lp').value);
  if(k==='reg'){const em=$('#re').value.trim().toLowerCase();if(db.users.some(u=>u.email===em))return toast(T('Surel sudah terdaftar','Email already registered'));
    const u={id:uid(),name:$('#rn').value.trim(),email:em,role:'mahasiswa',pw:await hash($('#rw').value),active:true,created:Date.now(),prodi:$('#rp').value.trim(),angkatan:$('#ra').value.trim()};
    db.users.push(u);db.consent[u.id]=Date.now();S.user=u;S.view='';store.set(SKEY,u.id);logA('register',u.email);save();toast(T('Pendaftaran berhasil','Registration successful'));return render()}
  if(k==='phq'){const ans=[...Array(9)].map((_,i)=>+(form.querySelector(`[name=q${i}]:checked`)?.value??0)),score=ans.reduce((a,b)=>a+b,0),ti=tierIdx(score);
    const rec={id:uid(),uid:S.user.id,ts:Date.now(),answers:ans,score,tier:ti,item9:ans[8]};db.assessments.push(rec);S.lastResult=rec;
    if(score>=10)notifyRole('konselor',{id:`Skrining PHQ-9 skor ${score} (${TIERS[ti].id}) — ${S.user.name}`,en:`PHQ-9 score ${score} (${TIERS[ti].en}) — ${S.user.name}`},score>=20||ans[8]?'crit':'warn','dasbor');
    if(score>=20||ans[8])notifyRole('admin',{id:`Notifikasi mendesak: ${TIERS[ti].id} (${pseud(S.user.id)}, skor ${score})`,en:`Urgent notification: ${TIERS[ti].en} (${pseud(S.user.id)}, score ${score})`},'crit','dasbor');
    logA('phq9',`${pseud(S.user.id)} skor ${score}`);save();return render()}
  if(k==='chat'){const i=$('#cin'),v=i.value;i.value='';return sendChat(v)}
  if(k==='appt'){const cid=$('#ac').value,date=$('#ad').value,slot=$('#as').value,mode=$('#am').value,note=$('#an').value.trim();S.form={cid,date,slot,note};
    if(date<iso(Date.now()+DAY))return toast(T('Pilih tanggal mulai besok','Choose a date from tomorrow'));
    if(isWeekend(date)){S.alt={msg:T('Layanan hanya Senin–Jumat. Pilih jadwal berikut:','The service runs Monday–Friday only. Choose one of these:'),list:alternatives(cid,date)};return render()}
    if(slotTaken(cid,date,slot)){S.alt={msg:T('Slot tersebut sudah terisi. Jadwal alternatif yang tersedia:','That slot is taken. Available alternatives:'),list:alternatives(cid,date)};return render()}
    db.appts.push({id:uid(),uid:S.user.id,cid,date,slot,mode,note,status:'pending',created:Date.now()});
    notify(cid,{id:`Permintaan janji baru dari ${S.user.name}: ${fmtISO(date)} ${slot}`,en:`New appointment request from ${S.user.name}: ${fmtISO(date)} ${slot}`},'info','antrean');logA('appt_create',`${date} ${slot}`);S.alt=null;S.form=null;save();toast(T('Janji diajukan. Menunggu konfirmasi konselor.','Request sent. Awaiting counselor confirmation.'));return render()}
  if(k==='note'){const uidv=form.dataset.uid,nid=form.dataset.nid,txt=$('#nt').value.trim();
    if(nid)db.notes.find(n=>n.id===nid).text=txt;else db.notes.push({id:uid(),uid:uidv,cid:S.user.id,ts:Date.now(),text:txt});logA('note_save',U(uidv).name);save();closeModal();toast(T('Catatan disimpan','Note saved'));return render()}
  if(k==='skm'){const scores=SKM_ITEMS.map((_,i)=>+form.querySelector(`[name=s${i}]:checked`).value);db.skm.push({id:uid(),uid:S.user.id,apptId:$('#sa').value,ts:Date.now(),scores,saran:$('#ss').value.trim()});logA('skm','');save();toast(T('Terima kasih atas penilaian Anda','Thank you for your rating'));return render()}
  if(k==='sus'){const answers=SUS_ITEMS.map((_,i)=>+form.querySelector(`[name=u${i}]:checked`).value);db.sus.push({id:uid(),uid:S.user.id,ts:Date.now(),answers,score:susScore(answers)});logA('sus','');save();toast(T('Terima kasih','Thank you'));return render()}
  if(k==='complaint'){const pub=form.dataset.pub==='1',code=newCode(),anon=pub||$('#ca')?.checked;
    db.complaints.push({id:uid(),code,uid:anon?null:S.user.id,anon:!!anon,cat:$('#ck').value,text:$('#ct').value.trim(),ts:Date.now(),status:'new',resp:[]});
    notifyRole('admin',{id:`Pengaduan baru ${code}`,en:`New complaint ${code}`},'warn','pengaduan');logA('complaint',code);save();
    return modal(`<h2>${T('Pengaduan diterima','Complaint received')}</h2><div class="note"><div class="small muted">${T('Kode tiket Anda','Your ticket code')}</div><div style="font-family:var(--serif);font-size:1.6rem;color:var(--g900)">${code}</div></div><p class="small">${T('Simpan kode ini untuk melacak tanggapan. Target tanggapan pertama ≤ 3 hari kerja.','Keep this code to track the response. First response target ≤ 3 working days.')}</p>${closeBtn()}`)}
  if(k==='track'){S.trackCode=$('#tk').value;return complaintModal()}
  if(k==='cresp'){const c=db.complaints.find(x=>x.id===form.dataset.id),tx=$('#cr').value.trim();if(tx)c.resp.push({ts:Date.now(),text:tx});c.status=$('#cs').value;logA('complaint_update',c.code+' → '+c.status);save();closeModal();toast(T('Tersimpan','Saved'));return render()}
  if(k==='pub'){const id=form.dataset.id;db.pubs=db.pubs||[];let r=db.pubs.find(x=>x.id===id);if(!r){r={id:uid(),ts:Date.now()};db.pubs.push(r)}Object.assign(r,{type:$('#pt').value,status:$('#ps').value,title:$('#pti').value.trim(),authors:$('#pau').value.trim(),venue:$('#pve').value.trim(),index:$('#pin').value.trim(),date:$('#pda').value,ref:$('#pre').value.trim(),url:$('#pur').value.trim(),note:$('#pno').value.trim()});logA('pub_save',r.title.slice(0,40));save();closeModal();toast(T('Tersimpan','Saved'));return render()}
  if(k==='user'){const id=form.dataset.id,em=$('#ue').value.trim().toLowerCase(),role=$('#ur').value,pv=$('#up').value.trim(),pw=$('#uw').value;if(db.users.some(u=>u.email===em&&u.id!==id))return toast(T('Surel sudah dipakai','Email already in use'));
    let u=db.users.find(x=>x.id===id);if(!u){u={id:uid(),active:true,created:Date.now()};db.users.push(u)}
    Object.assign(u,{name:$('#un').value.trim(),email:em,role});if(role==='mahasiswa')u.prodi=pv;else u.spec=pv;if(pw)u.pw=await hash(pw);else if(!u.pw)u.pw=await hash('ganti123');logA('user_save',em);save();closeModal();toast(T('Akun disimpan','Account saved'));return render()}
  if(k==='rule'){const id=form.dataset.id;let r=db.rules.find(x=>x.id===id);if(!r){r={id:uid(),active:true};db.rules.push(r)}
    r.cat={id:$('#rci').value.trim(),en:$('#rce').value.trim()};r.keywords=$('#rk').value.split(',').map(s=>s.trim()).filter(Boolean);r.reply={id:$('#rri').value.trim(),en:$('#rre').value.trim()};logA('rule_save',r.cat.id);save();closeModal();toast(T('Aturan disimpan','Rule saved'));return render()}
});
(async function init(){
  const raw=store.get(KEY);if(raw){try{db=JSON.parse(raw)}catch(e){db=null}}
  if(!db||!db.users)await seed();
  if(!db.pubs){db.pubs=seedPubs();save()}
  const sid=store.get(SKEY);if(sid){const u=db.users.find(x=>x.id===sid&&x.active);if(u)S.user=u}
  render();
})();

</script></body></html>
